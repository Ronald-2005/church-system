{% extends 'accounts/base.html' %}

{% block content %}
<div class="max-w-lg mx-auto mt-20 bg-white p-6 rounded-xl shadow-md text-center">
    <h2 class="text-xl font-bold text-red-600 mb-3">Delete Announcement?</h2>
    <p class="text-gray-700 mb-6">
        Are you sure you want to delete **{{ announcement.title }}**?
    </p>

    <form method="post">
        {% csrf_token %}
        
        <button type="submit"
            class="bg-red-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-red-700 transition-all">
            Confirm Delete
        </button>

        <a href="{% url 'announcements:announcement_list' %}"
           class="ml-3 text-gray-600 hover:text-gray-800">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
