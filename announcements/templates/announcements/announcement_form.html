{% extends 'accounts/base.html' %}
{% block title %}Manage Announcement{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white shadow-md p-8 rounded-xl mt-10">

    <h2 class="text-2xl font-bold text-slate-800 mb-6">
        {% if form.instance.pk %}✏ Edit Announcement{% else %}➕ Add Announcement{% endif %}
    </h2>

    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form.as_p }}
        </div>

        <button type="submit"
            class="mt-5 bg-purple-600 text-white px-5 py-2 rounded-lg hover:bg-purple-700 transition-all font-semibold">
            Save
        </button>

        <a href="{% url 'announcements:announcement_list' %}"
           class="ml-3 text-gray-600 hover:text-gray-800">
            Cancel
        </a>
    </form>

</div>
{% endblock %}
