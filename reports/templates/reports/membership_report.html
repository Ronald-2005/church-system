{% extends 'accounts/base.html' %}

{% block title %}Membership Report{% endblock %}

{% block content %}
<div class="p-6">
  <h1 class="text-2xl font-bold mb-6 text-indigo-700">Membership Report</h1>

  <div class="grid grid-cols-3 gap-6 mb-6">
    <div class="bg-white shadow rounded-xl p-4 text-center">
      <h2 class="text-xl font-semibold">Total Members</h2>
      <p class="text-3xl font-bold text-indigo-600">{{ total_members }}</p>
    </div>
    <div class="bg-white shadow rounded-xl p-4 text-center">
      <h2 class="text-xl font-semibold">Male Members</h2>
      <p class="text-3xl font-bold text-blue-600">{{ male_members }}</p>
    </div>
    <div class="bg-white shadow rounded-xl p-4 text-center">
      <h2 class="text-xl font-semibold">Female Members</h2>
      <p class="text-3xl font-bold text-pink-600">{{ female_members }}</p>
    </div>
  </div>

  <a href="{% url 'reports:download_membership_report' %}" 
     class="bg-indigo-600 text-white px-5 py-2 rounded-lg hover:bg-indigo-700 transition">
    Download Excel Report
  </a>
</div>
{% endblock %}
