{% extends 'accounts/base.html' %}
{% block title %}Admin Profile{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-pink-50 via-rose-50 to-pink-100 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-3xl mx-auto">
    <!-- Profile Header Card -->
    <div class="bg-white rounded-xl shadow-md border border-pink-200 overflow-hidden mb-6">
      <div class="bg-gradient-to-r from-pink-500 to-rose-600 px-8 py-6">
        <div class="flex items-center gap-4">
          <div class="w-20 h-20 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center shadow-lg">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <div class="flex-1">
            <h2 class="text-3xl font-bold text-white mb-1">
              Welcome, {{ user.username }} (Admin)
            </h2>
            <div class="flex items-center gap-2">
              <span class="inline-block w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
              <span class="text-pink-50">Administrator Account</span>
            </div>
          </div>
        </div>
      </div>
      
      <div class="px-8 py-6">
        <div class="flex items-center gap-3 text-slate-700">
          <svg class="w-5 h-5 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
          <span class="font-medium">Email:</span>
          <span class="text-slate-600">{{ user.email }}</span>
        </div>
      </div>
    </div>

    <!-- Action Buttons Card -->
    <div class="bg-white rounded-xl shadow-md border border-pink-200 overflow-hidden">
      <div class="p-8">
        <h3 class="text-lg font-bold text-slate-800 mb-6">Quick Actions</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <!-- Admin Dashboard Button -->
          <a 
            href="{% url 'accounts:admin_dashboard' %}" 
            class="group flex flex-col items-center justify-center p-6 bg-gradient-to-br from-pink-500 to-rose-600 rounded-xl shadow-md hover:shadow-lg transform hover:scale-[1.02] transition-all duration-200"
          >
            <div class="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-lg flex items-center justify-center mb-3 group-hover:scale-110 transition-transform duration-200">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1H5a1 1 0 01-1-1v-3zM14 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1h-4a1 1 0 01-1-1v-3z"></path>
              </svg>
            </div>
            <span class="text-white font-semibold text-center">Go to Admin Dashboard</span>
          </a>

          <!-- Edit Profile Button -->
          <a 
            href="{% url 'accounts:edit_profile' %}" 
            class="group flex flex-col items-center justify-center p-6 bg-gradient-to-br from-slate-500 to-slate-600 rounded-xl shadow-md hover:shadow-lg transform hover:scale-[1.02] transition-all duration-200"
          >
            <div class="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-lg flex items-center justify-center mb-3 group-hover:scale-110 transition-transform duration-200">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
              </svg>
            </div>
            <span class="text-white font-semibold text-center">Edit Profile</span>
          </a>

          <!-- Logout Button -->
          <a 
            href="{% url 'accounts:logout' %}" 
            class="group flex flex-col items-center justify-center p-6 bg-gradient-to-br from-red-500 to-rose-600 rounded-xl shadow-md hover:shadow-lg transform hover:scale-[1.02] transition-all duration-200"
          >
            <div class="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-lg flex items-center justify-center mb-3 group-hover:scale-110 transition-transform duration-200">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
              </svg>
            </div>
            <span class="text-white font-semibold text-center">Logout</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
