{% extends 'accounts/base.html' %}
{% block title %}Add Ceremony{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-6">
  <h2 class="text-2xl font-bold mb-4">Add New Ceremony</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Save</button>
  </form>
</div>
{% endblock %}
