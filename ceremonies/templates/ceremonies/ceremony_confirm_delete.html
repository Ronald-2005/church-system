{% extends 'accounts/base.html' %}
{% block title %}Delete Ceremony{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-12 bg-white shadow-lg rounded-lg p-6">
    <h2 class="text-xl font-bold text-red-600 mb-4">Confirm Delete</h2>

    <p class="mb-6">Are you sure you want to delete this ceremony?</p>

    <form method="post">
        {% csrf_token %}
        <div class="flex justify-between">
            <a href="{% url 'ceremonies:ceremony_list' %}"
               class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">
               Cancel
            </a>

            <button type="submit"
                    class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                Delete
            </button>
        </div>
    </form>
</div>
{% endblock %}
