{% extends 'accounts/base.html' %}

{% block title %}Delete Member{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-8 p-6 bg-white dark:bg-gray-800 rounded shadow text-center">
  <h1 class="text-2xl font-bold mb-4">Delete Member</h1>
  <p class="mb-6">Are you sure you want to delete <strong>{{ member.full_name }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Yes, Delete</button>
    <a href="{% url 'members:member_list' %}" class="ml-2 text-gray-600 hover:underline">Cancel</a>
  </form>
</div>
{% endblock %}
