{% extends 'accounts/base.html' %}
{% block title %}Delete Ministry{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8 bg-white p-6 rounded shadow">
  <h2 class="text-xl font-bold text-red-600">Delete {{ ministry.name }}?</h2>
  <form method="post">
    {% csrf_token %}
    <button class="px-3 py-1 bg-red-600 text-white rounded">Confirm Delete</button>
    <a href="{% url 'ministries:ministry_list' %}" class="ml-3 text-gray-600">Cancel</a>
  </form>
</div>
{% endblock %}
